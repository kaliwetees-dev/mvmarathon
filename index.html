<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTGFLIX - Ultimate FTP & Media Streamer</title>
    <!-- Google Fonts & Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel for Single File App -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #141414;
            color: #ffffff;
            overflow-x: hidden;
        }
        /* Custom Netflix Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #141414;
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4B5563;
        }
        /* Hide scrollbars for sliders while maintaining functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Glowing effects */
        .netflix-glow {
            box-shadow: 0 0 25px rgba(229, 9, 20, 0.5);
        }
        .hero-gradient {
            background: linear-gradient(to top, #141414 0%, rgba(20, 20, 20, 0.8) 40%, rgba(20, 20, 20, 0) 100%);
        }
        .modal-gradient {
            background: linear-gradient(to bottom, rgba(20, 20, 20, 0.95) 0%, #141414 100%);
        }
        /* Card Scale-up Animation */
        .movie-card {
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        .movie-card:hover {
            transform: scale(1.08);
            z-index: 30;
        }
    </style>
</head>
<body>

    <!-- Target mount container for React -->
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Custom SVGs for Lucide/Netflix style icons to remain self-contained
        const Icons = {
            Play: ({ className = "w-6 h-6" }) => (

            Pause: ({ className = "w-6 h-6" }) => (

            ),
            ChevronRight: ({ className = "w-6 h-6" }) => (

            ),
            Settings: ({ className = "w-5 h-5" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className={className}><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.1a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
            ),
            Close: ({ className = "w-6 h-6" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className={className}><path d="M18 6L6 18M6 6l12 12"/></svg>
            ),
            Sparkles: ({ className = "w-5 h-5" }) => (

            ),
            User: ({ className = "w-5 h-5" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className={className}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            ),
            CloudUpload: ({ className = "w-5 h-5" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className={className}><path d="M12 12V3m0 0L8.5 6.5M12 3l3.5 3.5M20 12a8 8 0 0 1-7.5 7.9A8 8 0 0 1 4 12"/></svg>
            ),
            ExternalLink: ({ className = "w-5 h-5" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className={className}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6m11-3h-5m5 0v5m0-5L11 11"/></svg>
            ),
            Copy: ({ className = "w-5 h-5" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className={className}><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            ),
            Trash: ({ className = "w-5 h-5" }) => (
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" className={className}><path d="M19 7l-.867 12.142A2 2 0 0 1 16.138 21H7.862a2 2 0 0 1-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v3M4 7h16" /></svg>
            )
        };

        const DEFAULT_MOVIES = [
            {
                id: "oppenheimer-2023",
                title: "Oppenheimer",
                filename: "Oppenheimer (2023) [1080p] [WEBRip].mp4",
                category: "Drama",
                year: "2023",
                rating: "8.9",
                match: "98% Match",
                quality: "4K UHD",
                duration: "3h 0m",
                description: "The story of American scientist J. Robert Oppenheimer and his role in the development of the atomic bomb during World War II, altering the course of human history.",
                poster: "https://images.unsplash.com/photo-1440404653325-ab127d49abc1?auto=format&fit=crop&w=600&q=80",
                banner: "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1600&q=80",
                streamUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/TearsOfSteel.mp4"
            },
            {
                id: "dune-part-2",
                title: "Dune: Part Two",
                filename: "Dune.Part.Two.2024.1080p.WEBRip.mp4",
                category: "Sci-Fi",
                year: "2024",
                rating: "8.8",
                match: "99% Match",
                quality: "HDR",
                duration: "2h 46m",
                description: "Paul Atreides unites with Chani and the Fremen while seeking revenge against the conspirators who destroyed his family, facing a choice between love and the universe's fate.",
                poster: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?auto=format&fit=crop&w=600&q=80",
                banner: "https://images.unsplash.com/photo-1534447677768-be436bb09401?auto=format&fit=crop&w=1600&q=80",
                streamUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4"
            },
            {
                id: "interstellar-2014",
                title: "Interstellar",
                filename: "Interstellar.2014.1080p.BluRay.mp4",
                category: "Sci-Fi",
                year: "2014",
                rating: "8.7",
                match: "96% Match",
                quality: "1080p",
                duration: "2h 49m",
                description: "A team of explorers travel through a wormhole in space in an attempt to ensure humanity's survival on a dying, dusty Earth.",
                poster: "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?auto=format&fit=crop&w=600&q=80",
                banner: "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=1600&q=80",
                streamUrl: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4"
            }
        ];

        function App() {
            const [movies, setMovies] = useState(() => {
                const stored = localStorage.getItem("ctgflix_movies");
                return stored ? JSON.parse(stored) : DEFAULT_MOVIES;
            });
            const [myList, setMyList] = useState(() => {
                const stored = localStorage.getItem("ctgflix_mylist");
                return stored ? JSON.parse(stored) : [];
            });
            const [watchHistory, setWatchHistory] = useState(() => {
                const stored = localStorage.getItem("ctgflix_history");
                return stored ? JSON.parse(stored) : [];
            });
            
            const [selectedMovie, setSelectedMovie] = useState(null);
            const [activePlayingMovie, setActivePlayingMovie] = useState(null);
            const [searchQuery, setSearchQuery] = useState("");
            const [isScrapeModalOpen, setIsScrapeModalOpen] = useState(false);
            const [rawHTMLInput, setRawHTMLInput] = useState("");
            const [targetServerUrl, setTargetServerUrl] = useState("https://ftp.ctgfun.com/English/");
            const [activeTab, setActiveTab] = useState("Home"); // Home, My List, FTP Library
            const [scrolled, setScrolled] = useState(false);
            const [infoAlert, setInfoAlert] = useState(null);

            // Sync database modifications
            useEffect(() => {
                localStorage.setItem("ctgflix_movies", JSON.stringify(movies));
            }, [movies]);

            useEffect(() => {
                localStorage.setItem("ctgflix_mylist", JSON.stringify(myList));
            }, [myList]);

            useEffect(() => {
                localStorage.setItem("ctgflix_history", JSON.stringify(watchHistory));
            }, [watchHistory]);

            // Navbar background transition on scroll
            useEffect(() => {
                const handleScroll = () => {
                    setScrolled(window.scrollY > 40);
                };
                window.addEventListener("scroll", handleScroll);
                return () => window.removeEventListener("scroll", handleScroll);
            }, []);

            const showAlert = (msg, type = "info") => {
                setInfoAlert({ msg, type });
                setTimeout(() => setInfoAlert(null), 4000);
            };

            const copyToClipboard = (text) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.position = "fixed";
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                try {
                    document.execCommand('copy');
                    showAlert("Stream link copied directly to clipboard!", "success");
                } catch (err) {
                    console.error('Copy fallback failed', err);
                    showAlert("Failed to copy link automatically.", "error");
                }
                document.body.removeChild(textArea);
            };

            const clearFTPCatalog = () => {
                if (confirm("Are you sure you want to delete all imported FTP movies and folders from your library?")) {
                    setMovies(DEFAULT_MOVIES);
                    showAlert("Cleared all imported FTP streams.", "info");
                }
            };

            // Smartly extracts folder name from the server prefix to auto-categorize movies
            const getFolderCategory = (url) => {
                try {
                    const cleaned = url.replace(/\/$/, ""); 
                    const parts = cleaned.split('/');
                    const lastPart = parts[parts.length - 1];
                    if (lastPart && lastPart.toLowerCase() !== "english" && lastPart.toLowerCase() !== "ftp.ctgfun.com" && lastPart.includes(".")) {
                        return "FTP Root";
                    }
                    if (lastPart) {
                        return lastPart.charAt(0).toUpperCase() + lastPart.slice(1);
                    }
                } catch(e) {}
                return "FTP Library";
            };

            const filteredMovies = useMemo(() => {
                let list = [...movies];
                
                if (activeTab === "My List") {
                    list = list.filter(m => myList.includes(m.id));
                } else if (activeTab === "FTP Library") {
                    list = list.filter(m => m.fromFTP);
                }

                if (searchQuery.trim() !== "") {
                    const q = searchQuery.toLowerCase();
                    list = list.filter(m => 
                        m.title.toLowerCase().includes(q) || 
                        (m.filename && m.filename.toLowerCase().includes(q)) ||
                        m.category.toLowerCase().includes(q)
                    );
                }
                return list;
            }, [movies, activeTab, myList, searchQuery]);

            // Group all imported FTP files by folder categories to dynamically populate rows
            const ftpCategories = useMemo(() => {
                const ftpMovies = movies.filter(m => m.fromFTP && !m.isFolder);
                const categories = {};
                ftpMovies.forEach(m => {
                    const cat = m.category || "FTP Library";
                    if (!categories[cat]) {
                        categories[cat] = [];
                    }
                    categories[cat].push(m);
                });
                return categories;
            }, [movies]);

            // Parses Apache / IIS open directories instantly from user copy-pasted html source
            const parseOpenDirectoryHTML = () => {
                if (!rawHTMLInput.trim()) {
                    showAlert("Please paste some HTML file list contents first!", "error");
                    return;
                }

                try {
                    // Regular expression to scan anchor tags
                    const regex = /<a\s+(?:[^>]*?\s+)?href="([^"]+)"[^>]*>([\s\S]*?)<\/a>/gi;
                    let match;
                    const detectedFiles = [];
                    const detectedFolders = [];
                    
                    while ((match = regex.exec(rawHTMLInput)) !== null) {
                        const href = match[1];
                        const linkText = match[2].replace(/<[^>]*>/g, '').trim();
                        
                        if (href) {
                            const filename = decodeURIComponent(href);
                            // Avoid index parent folder links, query strings, and absolute paths
                            if (filename.startsWith('/') || filename.startsWith('http') || filename.includes('?') || filename === '../') {
                                continue;
                            }

                            // Grab valid media types commonly hosted on BDIX servers
                            if (filename.endsWith('.mp4') || filename.endsWith('.mkv') || filename.endsWith('.avi') || filename.endsWith('.webm')) {
                                detectedFiles.push({ filename, rawHref: href, linkText, isFolder: false });
                            } 
                            // Grab subfolders (usually end with a slash or represent directories)
                            else if (filename.endsWith('/') && filename.length > 1) {
                                detectedFolders.push({ filename, rawHref: href, linkText, isFolder: true });
                            }
                        }
                    }

                    if (detectedFiles.length === 0 && detectedFolders.length === 0) {
                        showAlert("Could not find any video links or folders in the provided HTML. Make sure you copy-paste the whole page source!", "error");
                        return;
                    }

                    const unsplashTechBanners = [
                        "https://images.unsplash.com/photo-1536440136628-849c177e76a1",
                        "https://images.unsplash.com/photo-1509198397868-475647b2a1e5",
                        "https://images.unsplash.com/photo-1462331940025-496dfbfc7564",
                        "https://images.unsplash.com/photo-1518709268805-4e9042af9f23",
                        "https://images.unsplash.com/photo-1436491865332-7a61a109cc05",
                        "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86"
                    ];

                    const currentCategory = getFolderCategory(targetServerUrl);

                    const parsedCards = [
                        ...detectedFolders.map((folder, i) => {
                            const buildFolderUrl = targetServerUrl.endsWith('/') ? targetServerUrl + folder.rawHref : targetServerUrl + '/' + folder.rawHref;
                            return {
                                id: `ftp-folder-${i}-${Date.now()}`,
                                title: folder.linkText.replace(/\/$/, '') || folder.filename.replace(/\/$/, ''),
                                filename: folder.filename,
                                category: "Folder",
                                year: "Directory",
                                rating: "Folder",
                                match: "Explore Folder",
                                quality: "FTP DIR",
                                duration: "Multiple Files",
                                description: `Subfolder directory detected. Click this card to quickly direct CTGFLIX to explore and index this directory folder!`,
                                poster: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=600&q=80",
                                banner: "https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1600&q=80",
                                streamUrl: buildFolderUrl,
                                fromFTP: true,
                                isFolder: true
                            };
                        }),
                        ...detectedFiles.map((file, i) => {
                            // Clean file title naming
                            let displayTitle = file.filename
                                .replace(/\.[^/.]+$/, "") // strip extension
                                .replace(/[\._\-+]/g, ' ') // convert special spacing chars to real space
                                .replace(/\b(1080p|720p|2160p|webrip|bluray|x264|x265|h264|hevc|dd5|dual|audio|eng|esub|mkv|mp4)\b/gi, '') // clean rip keywords
                                .trim();

                            if (displayTitle.length === 0) displayTitle = file.linkText || file.filename;

                            const randomBanner = unsplashTechBanners[i % unsplashTechBanners.length];
                            const buildFullUrl = targetServerUrl.endsWith('/') ? targetServerUrl + file.rawHref : targetServerUrl + '/' + file.rawHref;

                            return {
                                id: `ftp-file-${i}-${Date.now()}`,
                                title: displayTitle,
                                filename: file.filename,
                                category: currentCategory,
                                year: new Date().getFullYear().toString(),
                                rating: (7.0 + (Math.random() * 2.8)).toFixed(1),
                                match: `${Math.floor(85 + Math.random() * 15)}% Match`,
                                quality: file.filename.toLowerCase().includes("2160") || file.filename.toLowerCase().includes("4k") ? "4K UHD" : "1080p",
                                duration: "Varies",
                                description: `File stream parsed from: ${file.filename}. Click Play to stream instantly from your configured BDIX server URL directly inside your web app.`,
                                poster: `${randomBanner}?auto=format&fit=crop&w=600&q=80`,
                                banner: `${randomBanner}?auto=format&fit=crop&w=1600&q=80`,
                                streamUrl: buildFullUrl,
                                fromFTP: true,
                                isFolder: false
                            };
                        })
                    ];

                    // Merge and prevent duplicates while holding the entire archive of parsed folders!
                    setMovies(prev => {
                        const newStreamUrls = new Set(parsedCards.map(c => c.streamUrl));
                        const filteredPrev = prev.filter(m => !newStreamUrls.has(m.streamUrl));
                        return [...parsedCards, ...filteredPrev];
                    });

                    setIsScrapeModalOpen(false);
                    setRawHTMLInput("");
                    setActiveTab("Home");
                    showAlert(`Successfully imported ${detectedFiles.length} movies into "${currentCategory}" category, alongside ${detectedFolders.length} subfolders!`, "success");

                } catch (e) {
                    console.error(e);
                    showAlert("An error occurred during parsing. Double check your HTML layout.", "error");
                }
            };

            const toggleMyList = (id, e) => {
                if (e) e.stopPropagation();
                if (myList.includes(id)) {
                    setMyList(prev => prev.filter(mid => mid !== id));
                    showAlert("Removed from My List");
                } else {
                    setMyList(prev => [...prev, id]);
                    showAlert("Added to My List", "success");
                }
            };

            const triggerPlayMovie = (movie, e) => {
                if (e) e.stopPropagation();
                if (movie.isFolder) {
                    setTargetServerUrl(movie.streamUrl);
                    setIsScrapeModalOpen(true);
                    showAlert(`Now targeting: ${getFolderCategory(movie.streamUrl)}. View directory source, copy, and paste to add it to your library!`, "info");
                    return;
                }
                setActivePlayingMovie(movie);
                
                // Add to watch progress history
                if (!watchHistory.some(h => h.id === movie.id)) {

                                                    <a 
                                                        href={`potplayer://${selectedMovie.streamUrl}`}
                                                        className="bg-blue-600/20 hover:bg-blue-600/35 border border-blue-500/40 text-blue-300 px-3.5 py-1.5 rounded text-xs font-semibold flex items-center space-x-1.5 transition"
                                                    >
                                                        <Icons.ExternalLink className="w-3.5 h-3.5" />
                                                        <span>PotPlayer</span>
                                                    </a>
                                                    <a 
                                                        href={`intent:${selectedMovie.streamUrl}#Intent;package=com.mxtech.videoplayer.ad;end`}
                                                        className="bg-teal-600/20 hover:bg-teal-600/35 border border-teal-500/40 text-teal-300 px-3.5 py-1.5 rounded text-xs font-semibold flex items-center space-x-1.5 transition"
                                                    >
                                                        <Icons.ExternalLink className="w-3.5 h-3.5" />
                                                        <span>MX Player</span>
                                                    </a>
                                                    <button 
                                                        onClick={() => copyToClipboard(selectedMovie.streamUrl)}
                                                        className="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-3.5 py-1.5 rounded text-xs font-semibold flex items-center space-x-1.5 transition"
                                                    >
                                                        <Icons.Copy className="w-3.5 h-3.5" />
                                                        <span>Copy Link</span>
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                    </div>

                                    {/* Sidebar Tags */}
                                    <div className="space-y-4 text-xs text-zinc-400">
                                        <div>
                                            <span className="text-zinc-500 font-bold block mb-1">Type:</span>
                                            <span className="text-zinc-300">{selectedMovie.isFolder ? "Server Folder Directory" : "Video Media Stream"}</span>
                                        </div>
                                        <div>
                                            <span className="text-zinc-500 font-bold block mb-1">BDIX Server Source IP:</span>
                                            <span className="text-zinc-300 font-mono break-all">{selectedMovie.streamUrl.substring(0, 45)}...</span>
                                        </div>
                                        {selectedMovie.isFolder && (
                                            <div className="bg-amber-950/20 border border-amber-900/40 p-2.5 rounded text-amber-300/90">
                                                <span className="font-bold block mb-1 text-amber-400 text-xs">How to explore:</span>
                                                Clicking "Explore Folder" will auto-configure your Base Server URL. Then open the folder link in a browser tab, copy the page source, and paste it back into your importer!
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* CUSTOM DISTRACTION-FREE MOVIE PLAYER HUD */}
                    {activePlayingMovie && (
                        <CustomVideoPlayer 
                            movie={activePlayingMovie} 
                            playlist={movies}
                            onClose={() => setActivePlayingMovie(null)}
                            onPlayNext={(nextMovie) => setActivePlayingMovie(nextMovie)}
                            updateHistory={updateMovieHistoryProgress}
                            copyLink={copyToClipboard}
                        />
                    )}

                </div>
            );
        }

        // Horizontal sliding shelf for rows
        function MovieCarousel({ title, movies, onPlay, onSelect, onToggleList, myList }) {
            const rowRef = useRef(null);

            const scroll = (direction) => {
                if (rowRef.current) {
                    const { scrollLeft, clientWidth } = rowRef.current;
                    const scrollTo = direction === "left" ? scrollLeft - clientWidth * 0.75 : scrollLeft + clientWidth * 0.75;
                    rowRef.current.scrollTo({ left: scrollTo, behavior: "smooth" });
                }
            };

            if (movies.length === 0) return null;

            return (
                <div className="space-y-2 relative group/row">
                    <h2 className="text-sm md:text-xl font-bold text-zinc-200 tracking-wide pl-2">{title}</h2>
                    
                    {/* Carousel Wrapper */}
                    <div className="relative">
                        {/* Scroll buttons on hover */}
                        <button 
                            onClick={() => scroll("left")}
                            className="absolute left-0 top-0 bottom-0 z-30 bg-black/60 hover:bg-black/80 text-white px-2 opacity-0 group-hover/row:opacity-100 transition duration-300 hidden md:flex items-center justify-center"
                        >
                            <Icons.ChevronLeft className="w-8 h-8" />
                        </button>

                        <div 
                            ref={rowRef}
                            className="flex space-x-3.5 overflow-x-auto py-3 px-2 no-scrollbar scroll-smooth"
                        >
                            {movies.map((movie) => (
                                <div 
                                    key={movie.id}
                                    onClick={() => onSelect(movie)}
                                    className="flex-none w-40 sm:w-48 md:w-56 bg-[#181818] rounded-md overflow-hidden relative cursor-pointer movie-card shadow-lg hover:shadow-2xl hover:shadow-black/60"
                                >
                                    <div className="relative aspect-video">
                                        <img src={movie.poster} className="w-full h-full object-cover" alt={movie.title}/>
                                        <div className="absolute top-1.5 right-1.5 bg-black/75 px-1.5 py-0.5 rounded text-[10px] font-bold text-zinc-300 border border-zinc-700/50">
                                            {movie.quality}
                                        </div>
                                    </div>
                                    <div className="p-2.5 space-y-1">
                                        <h3 className="text-xs font-bold truncate text-white" title={movie.title}>{movie.title}</h3>
                                        <div className="flex items-center justify-between text-[9px] text-zinc-400">
                                            <span className="text-green-500 font-semibold">{movie.match}</span>
                                            <span>{movie.year}</span>
                                        </div>
                                        <div className="flex items-center justify-between pt-1">
                                            <button 
                                                onClick={(e) => onPlay(movie, e)}
                                                className="bg-red-600 hover:bg-red-700 text-white p-1 rounded-full flex items-center justify-center transition hover:scale-105"
                                            >
                                                <Icons.Play className="w-3 h-3 text-white fill-current" />
                                            </button>
                                            <button 
                                                onClick={(e) => onToggleList(movie.id, e)}
                                                className="text-zinc-500 hover:text-white p-1"
                                            >
                                                {myList.includes(movie.id) ? <Icons.Check className="w-3.5 h-3.5 text-emerald-500" /> : <Icons.Plus className="w-3.5 h-3.5" />}
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>

                        <button 
                            onClick={() => scroll("right")}
                            className="absolute right-0 top-0 bottom-0 z-30 bg-black/60 hover:bg-black/80 text-white px-2 opacity-0 group-hover/row:opacity-100 transition duration-300 hidden md:flex items-center justify-center"
                        >
                            <Icons.ChevronRight className="w-8 h-8" />
                        </button>
                    </div>
                </div>
            );
        }

        function CustomVideoPlayer({ movie, playlist, onClose, onPlayNext, updateHistory, copyLink }) {
            const videoRef = useRef(null);
            const containerRef = useRef(null);
            
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(1);
            const [isMuted, setIsMuted] = useState(false);
            const [playbackRate, setPlaybackRate] = useState(1);
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [showPlaylistSidebar, setShowPlaylistSidebar] = useState(false);
            const [isControlsVisible, setIsControlsVisible] = useState(true);
            const [playerError, setPlayerError] = useState(null);

            // Keep controls interactive when mouse moves
            let timeoutId = null;
            const handleMouseMove = () => {
                setIsControlsVisible(true);
                clearTimeout(timeoutId);
                timeoutId = setTimeout(() => {
                    if (isPlaying) {
                        setIsControlsVisible(false);
                    }
                }, 3000);
            };

            useEffect(() => {
                window.addEventListener("mousemove", handleMouseMove);
                return () => {
                    window.removeEventListener("mousemove", handleMouseMove);
                    clearTimeout(timeoutId);
                };
            }, [isPlaying]);

            // Track timeline adjustments
            const formatTime = (timeInSeconds) => {
                if (isNaN(timeInSeconds)) return "0:00";
                const hours = Math.floor(timeInSeconds / 3600);
                const minutes = Math.floor((timeInSeconds % 3600) / 60);
                const seconds = Math.floor(timeInSeconds % 60);

                const secondsFormatted = seconds < 10 ? `0${seconds}` : seconds;

                if (hours > 0) {
                    const minutesFormatted = minutes < 10 ? `0${minutes}` : minutes;
                    return `${hours}:${minutesFormatted}:${secondsFormatted}`;
                }
                return `${minutes}:${secondsFormatted}`;
            };

            // Player logic hooks
            const togglePlay = () => {
                if (!videoRef.current) return;
                if (isPlaying) {
                    videoRef.current.pause();
                    setIsPlaying(false);
                } else {
                    videoRef.current.play().then(() => {
                        setIsPlaying(true);
                        setPlayerError(null);
                    }).catch(err => {
                        console.error(err);
                        setPlayerError("Direct stream block or source unsupported. Web players can't render unsupported codecs (like MKV/AVI directly) without browser transcode capabilities. Use the external player options below for instant lag-free streaming!");
                    });
                }
            };

            const skipTime = (amount) => {
                if (videoRef.current) {
                    videoRef.current.currentTime = Math.max(0, Math.min(videoRef.current.duration, videoRef.current.currentTime + amount));
                }
            };

            const handleVolumeChange = (e) => {
                const val = parseFloat(e.target.value);
                setVolume(val);
                if (videoRef.current) {
                    videoRef.current.volume = val;
                    videoRef.current.muted = val === 0;
                }
                setIsMuted(val === 0);
            };

            const toggleMute = () => {
                if (videoRef.current) {
                    const nextMuted = !isMuted;
                    videoRef.current.muted = nextMuted;
                    setIsMuted(nextMuted);
                    if (nextMuted) {
                        videoRef.current.volume = 0;
                    } else {
                        videoRef.current.volume = volume || 0.5;
                    }
                }
            };

            const handleSpeedChange = (rate) => {
                setPlaybackRate(rate);
                if (videoRef.current) {
                    videoRef.current.playbackRate = rate;
                }
            };

            const handleTimelineScrub = (e) => {
                const val = parseFloat(e.target.value);
                setCurrentTime(val);
                if (videoRef.current) {
                    videoRef.current.currentTime = val;
                }
            };

            const toggleFullscreen = () => {
                if (!containerRef.current) return;
                
                if (!document.fullscreenElement) {
                    containerRef.current.requestFullscreen().then(() => {
                        setIsFullscreen(true);
                    }).catch(err => console.error(err));
                } else {
                    document.exitFullscreen();
                    setIsFullscreen(false);
                }
            };

            const handleTimeUpdate = () => {
                if (videoRef.current) {
                    setCurrentTime(videoRef.current.currentTime);
                    
                    // Periodically save progress to history
                    if (videoRef.current.duration > 0) {
                        const progressPercent = Math.floor((videoRef.current.currentTime / videoRef.current.duration) * 100);
                        updateHistory(movie.id, progressPercent);
                    }
                }
            };

            const handleLoadedMetadata = () => {
                if (videoRef.current) {
                    setDuration(videoRef.current.duration);
                    videoRef.current.play().then(() => {
                        setIsPlaying(true);
                        setPlayerError(null);
                    }).catch(() => {
                        setIsPlaying(false);
                    });
                }
            };

            return (
                <div 
                    ref={containerRef}
                    className="fixed inset-0 z-50 bg-black flex items-center justify-center animate-fade-in text-white select-none overflow-hidden"
                >
                    {/* VIDEO FEED TAG */}
                    <video 
                        ref={videoRef}
                        src={movie.streamUrl}
                        onTimeUpdate={handleTimeUpdate}
                        onLoadedMetadata={handleLoadedMetadata}
                        onClick={togglePlay}
                        onError={(e) => setPlayerError("Stream loading failed. If this is an MKV/AVI file, or encodes surround sound audio tracks (AC3/DTS), browsers will block native playback. Use one of the external player protocols below!")}
                        className="w-full h-full object-contain"
                    />

                    {/* MOVIE LOADING/CORES BLOCKS ERROR NOTIFICATION */}
                    {playerError && (
                        <div className="absolute inset-0 bg-[#0c0c0c]/95 flex flex-col items-center justify-center p-6 text-center z-30 animate-fade-in">
                            <div className="w-14 h-14 rounded-full bg-red-600/10 border border-red-500/50 flex items-center justify-center mb-3">
                                <Icons.Info className="text-red-500 w-7 h-7 animate-pulse" />
                            </div>
                            <h3 className="text-lg md:text-xl font-bold text-red-500">HTML5 Playback Restricted</h3>
                            <p className="text-xs md:text-sm text-zinc-400 max-w-lg mt-2 leading-relaxed">
                                {playerError}
                            </p>

                            {/* Direct External Player launcher - Absolute fix for browser stream failure */}
                            <div className="mt-6 bg-zinc-900 border border-zinc-800 p-4 rounded-lg max-w-lg w-full space-y-3.5 text-left shadow-2xl">
                                <span className="text-[11px] font-bold text-zinc-400 uppercase tracking-wider block">Recommended Fix: Open Stream in App</span>
                                
                                <div className="grid grid-cols-3 gap-2.5">
                                    <a 
                                        href={`vlc://${movie.streamUrl}`}
                                        className="bg-amber-600 hover:bg-amber-700 text-white py-2 rounded text-xs font-bold text-center flex flex-col items-center justify-center space-y-1 transition duration-150"
                                    >
                                        <Icons.ExternalLink className="w-4 h-4" />
                                        <span>Open in VLC</span>
                                    </a>
                                    <a 
                                        href={`potplayer://${movie.streamUrl}`}
                                        className="bg-blue-600 hover:bg-blue-700 text-white py-2 rounded text-xs font-bold text-center flex flex-col items-center justify-center space-y-1 transition duration-150"
                                    >
                                        <Icons.ExternalLink className="w-4 h-4" />
                                        <span>PotPlayer</span>
                                    </a>
                                    <a 
                                        href={`intent:${movie.streamUrl}#Intent;package=com.mxtech.videoplayer.ad;end`}
                                        className="bg-teal-600 hover:bg-teal-700 text-white py-2 rounded text-xs font-bold text-center flex flex-col items-center justify-center space-y-1 transition duration-150"
                                    >
                                        <Icons.ExternalLink className="w-4 h-4" />
                                        <span>MX Player</span>
                                    </a>
                                </div>

                                <button 
                                    onClick={() => copyLink(movie.streamUrl)}
                                    className="w-full bg-zinc-800 hover:bg-zinc-700 text-zinc-300 py-2 rounded text-xs font-bold flex items-center justify-center space-x-1.5 transition"
                                >
                                    <Icons.Copy className="w-4 h-4" />
                                    <span>Copy Direct Stream URL</span>
                                </button>
                            </div>

                            <div className="mt-5 flex items-center gap-4">
                                <button 
                                    onClick={() => setPlayerError(null)}
                                    className="text-xs text-zinc-500 hover:text-zinc-300 underline"
                                >
                                    Ignore Error
                                </button>
                                <button 
                                    onClick={onClose}
                                    className="bg-zinc-800 text-zinc-200 px-5 py-2 rounded text-xs font-semibold hover:bg-zinc-700 transition"
                                >
                                    Exit Player
                                </button>
                            </div>
                        </div>
                    )}

                    {/* HUD & PLAYER OVERLAY CONTROLS */}
                    <div className={`absolute inset-0 flex flex-col justify-between p-4 bg-gradient-to-t from-black/80 via-transparent to-black/80 transition-opacity duration-300 z-20 ${isControlsVisible ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}>
                        
                        {/* Top Bar Controls */}
                        <div className="flex items-center justify-between">
                            <button 
                                onClick={onClose}
                                className="flex items-center space-x-2 text-zinc-300 hover:text-white transition group"
                            >
                                <Icons.ChevronLeft className="w-8 h-8 group-hover:transform group-hover:-translate-x-1 transition-transform" />
                                <div className="text-left">
                                    <span className="text-xs text-zinc-400 block font-bold uppercase tracking-wider">Back to Browse</span>
                                    <h2 className="text-sm md:text-lg font-extrabold text-white truncate max-w-xs md:max-w-md">{movie.title}</h2>
                                </div>
                            </button>

                            <div className="flex items-center space-x-4">
                                <div className="hidden sm:flex items-center space-x-2 bg-zinc-900/90 border border-zinc-800 rounded p-1.5">
                                    <span className="text-[10px] text-zinc-500 font-bold px-1.5">EXTERNAL:</span>
                                    <a href={`vlc://${movie.streamUrl}`} className="text-zinc-400 hover:text-white text-xs px-2 py-0.5 rounded hover:bg-amber-600/20 transition">VLC</a>
                                    <a href={`potplayer://${movie.streamUrl}`} className="text-zinc-400 hover:text-white text-xs px-2 py-0.5 rounded hover:bg-blue-600/20 transition">Pot</a>
                                    <button onClick={() => copyLink(movie.streamUrl)} className="text-zinc-400 hover:text-white text-xs px-2 py-0.5 rounded hover:bg-zinc-800 transition">Copy</button>
                                </div>

                                <button 
                                    onClick={() => setShowPlaylistSidebar(!showPlaylistSidebar)}
                                    className={`p-2 rounded-full transition ${showPlaylistSidebar ? 'bg-red-600 text-white' : 'bg-black/60 hover:bg-black/80 text-zinc-300 hover:text-white'}`}
                                    title="Show Folder Playlist"
                                >
                                    <Icons.Grid className="w-5 h-5" />
                                </button>
                            </div>
                        </div>

                        {/* Mid controls */}
                        <div className="absolute inset-y-1/3 inset-x-1/4 flex items-center justify-around opacity-0 hover:opacity-100 transition-opacity pointer-events-none">
                            <button onClick={() => skipTime(-10)} className="p-4 rounded-full bg-black/40 hover:bg-black/60 text-white pointer-events-auto">
                                <span className="block text-xs font-bold">-10s</span>
                            </button>
                            <button onClick={togglePlay} className="p-6 rounded-full bg-black/40 hover:bg-black/60 text-white pointer-events-auto">
                                {isPlaying ? <Icons.Pause className="w-8 h-8" /> : <Icons.Play className="w-8 h-8" />}
                            </button>
                            <button onClick={() => skipTime(10)} className="p-4 rounded-full bg-black/40 hover:bg-black/60 text-white pointer-events-auto">
                                <span className="block text-xs font-bold">+10s</span>
                            </button>
                        </div>

                        {/* Bottom Controller bar */}
                        <div className="space-y-4">
                            {/* Seek Slider and Timestamps */}
                            <div className="flex items-center space-x-3 bg-black/40 p-2 rounded-lg backdrop-blur-xs">
                                <span className="text-xs text-zinc-300 font-mono">{formatTime(currentTime)}</span>
                                <input 
                                    type="range"
                                    min="0"
                                    max={duration || 100}
                                    value={currentTime}
                                    onChange={handleTimelineScrub}
                                    className="w-full h-1.5 bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-red-600 focus:outline-none"
                                />
                                <span className="text-xs text-zinc-300 font-mono">{formatTime(duration)}</span>
                            </div>

                            {/* Controls buttons */}
                            <div className="flex items-center justify-between pb-2">
                                <div className="flex items-center space-x-6">
                                    <button onClick={togglePlay} className="text-white hover:scale-110 transition">
                                        {isPlaying ? <Icons.Pause className="w-7 h-7" /> : <Icons.Play className="w-7 h-7" />}
                                    </button>

                                    <button onClick={() => skipTime(-10)} className="text-zinc-400 hover:text-white transition">
                                        <Icons.RotateCcw className="w-5 h-5" />
                                    </button>

                                    <div className="flex items-center space-x-2 group/volume">
                                        <button onClick={toggleMute} className="text-zinc-400 hover:text-white transition">
                                            {isMuted ? <Icons.VolumeMuted className="w-5 h-5" /> : <Icons.VolumeHigh className="w-5 h-5" />}
                                        </button>
                                        <input 
                                            type="range" 
                                            min="0"
                                            max="1"
                                            step="0.05"
                                            value={isMuted ? 0 : volume}
                                            onChange={handleVolumeChange}
                                            className="w-16 h-1 bg-zinc-700 rounded-lg appearance-none cursor-pointer accent-white opacity-0 group-hover/volume:opacity-100 transition-opacity"
                                        />
                                    </div>
                                </div>

                                <div className="flex items-center space-x-5">
                                    <div className="flex items-center space-x-2 bg-zinc-900/60 rounded px-2 py-1 text-xs">
                                        <span className="text-zinc-400">Speed:</span>
                                        {[1, 1.25, 1.5, 2].map((r) => (
                                            <button 
                                                key={r}
                                                onClick={() => handleSpeedChange(r)}
                                                className={`px-1.5 py-0.5 rounded font-bold transition ${playbackRate === r ? 'bg-red-600 text-white' : 'text-zinc-400 hover:text-white'}`}
                                            >
                                                {r}x
                                            </button>
                                        ))}
                                    </div>

                                    <button onClick={toggleFullscreen} className="text-zinc-400 hover:text-white transition">
                                        <Icons.Maximize className="w-5 h-5" />
                                    </button>
                                </div>
                            </div>
                        </div>

                    </div>

                    {/* PLAYLIST / FOLDER INDEX SIDEBAR PANEL */}
                    {showPlaylistSidebar && (
                        <div className="absolute top-0 right-0 h-full w-80 md:w-96 bg-zinc-950/95 border-l border-zinc-800/80 z-30 p-6 flex flex-col justify-between shadow-2xl animate-fade-in">
                            <div className="space-y-4">
                                <div className="flex items-center justify-between pb-3 border-b border-zinc-800">
                                    <div>
                                        <h3 className="text-md font-extrabold text-white">Folder Playlist</h3>
                                        <p className="text-xs text-zinc-500">Other available video files</p>
                                    </div>
                                    <button 
                                        onClick={() => setShowPlaylistSidebar(false)}
                                        className="text-zinc-400 hover:text-white transition"
                                    >
                                        <Icons.Close className="w-5 h-5" />
                                    </button>
                                </div>

                                {/* List of files */}
                                <div className="space-y-2.5 overflow-y-auto max-h-[70vh] pr-2 no-scrollbar">
                                    {playlist.map((item) => (
                                        <div 
                                            key={item.id}
                                            onClick={() => { onPlayNext(item); setPlayerError(null); }}
                                            className={`p-3 rounded border text-left cursor-pointer transition flex space-x-3 items-center ${item.id === movie.id ? 'bg-red-950/40 border-red-800' : 'bg-zinc-900/50 border-zinc-800 hover:bg-zinc-800/80'}`}
                                        >
                                            <div className="w-12 h-8 rounded bg-zinc-800 flex-none relative overflow-hidden">
                                                <img src={item.poster} className="w-full h-full object-cover" alt=""/>
                                                <div className="absolute inset-0 bg-black/40 flex items-center justify-center">
                                                    <Icons.Play className="w-3 h-3 text-white" />
                                                </div>
                                            </div>
                                            <div className="flex-1 min-w-0">
                                                <h4 className="text-xs font-bold text-white truncate">{item.title}</h4>
                                                <p className="text-[10px] text-zinc-500 font-mono truncate">{item.filename || "Static Stream"}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            <div className="pt-4 border-t border-zinc-800 text-[10px] text-zinc-500">
                                Powered by CTGFLIX Open Index Stream Engine.
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
</html>
